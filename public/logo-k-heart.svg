<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Special+Elite&amp;display=swap');
      .k-letter { font-family: 'Special Elite', 'Courier Prime', 'Courier New', 'American Typewriter', monospace; font-weight: 700; }
    </style>
    <path id="heart" d="M0,125 C0,125 -140,35 -140,-45 C-140,-95 -100,-125 -60,-125 C-30,-125 -10,-105 0,-80 C10,-105 30,-125 60,-125 C100,-125 140,-95 140,-45 C140,35 0,125 0,125 Z"/>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0a1f5c" stop-opacity="0.55"/><stop offset="55%" stop-color="#23479a" stop-opacity="0.35"/><stop offset="100%" stop-color="#bae0fc" stop-opacity="0.04"/></radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#cfe4fb" stop-opacity="0.55"/><stop offset="100%" stop-color="#cfe4fb" stop-opacity="0"/></radialGradient>
    <linearGradient id="kGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a1f5c"/><stop offset="100%" stop-color="#16357a"/></linearGradient>
  </defs>
  <circle cx="200" cy="200" r="198" fill="url(#bg)"/>
  <g fill="none" stroke-linejoin="round">
    <use href="#heart" transform="translate(200,200) scale(0.5)" stroke="#0a1f5c" stroke-width="3" vector-effect="non-scaling-stroke" opacity="0.95"/>
    <use href="#heart" transform="translate(200,200) scale(0.67)" stroke="#1f3f8a" stroke-width="2.7" vector-effect="non-scaling-stroke" opacity="0.8"/>
    <use href="#heart" transform="translate(200,200) scale(0.84)" stroke="#3a6fb0" stroke-width="2.4" vector-effect="non-scaling-stroke" opacity="0.66"/>
    <use href="#heart" transform="translate(200,200) scale(1.01)" stroke="#5a86c4" stroke-width="2.1" vector-effect="non-scaling-stroke" opacity="0.54"/>
    <use href="#heart" transform="translate(200,200) scale(1.18)" stroke="#7ea8d8" stroke-width="1.8" vector-effect="non-scaling-stroke" opacity="0.42"/>
    <use href="#heart" transform="translate(200,200) scale(1.35)" stroke="#a8d4f0" stroke-width="1.6" vector-effect="non-scaling-stroke" opacity="0.3"/>
  </g>
  <circle cx="200" cy="200" r="80" fill="url(#core)"/>
  <text x="200" y="200" text-anchor="middle" dominant-baseline="central" font-size="102" class="k-letter" fill="url(#kGrad)" stroke="#0a1f5c" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke">K</text>
</svg>
